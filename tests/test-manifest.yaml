  - id: lock-busy-record-renewed
    name: Busy record renewed on join
    description: A key joining an exclusive record this node has held past renewAfter writes its claim slot again, so a busy node does not lose the record as stale
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestJoiningKeyRenewsBusyRecord

  - id: inode-write-same-node-reader
    name: Inode write does not hang behind same-node reader
    description: Table.Write on a directory finishes while another goroutine on the node holds the directory's shared lock and reads the inode table
    priority: go_only
    environments:
      go: internal/inode/lock_test.go::TestWriteDoesNotHangBehindSameNodeReader

  - id: write-failure-keeps-committed-blocks
    name: Failed write keeps blocks committed mid-write
    description: When the final inode write fails after a mid-write persist committed a new block, the retry finds that block still allocated and mapped
    priority: go_only
    environments:
      go: internal/goclusterfs/lock_commit_test.go::TestFailedWriteKeepsBlocksCommittedMidWrite

  - id: lock-released-hold-cached
    name: Released hold cached for grace
    description: After its last local holder releases, a node keeps the record for CacheGrace, and another node gets it soon after
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestReleasedHoldIsCachedForGrace

  - id: lock-idle-hold-frees-before-turn
    name: Idle cached hold frees before the turn ends
    description: Another node gets a record held idle in a cache sooner than the HoldTurn a busy holder keeps it
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestIdleCachedHoldFreesBeforeTurnEnds

  - id: lock-overlapping-holds-yield
    name: Overlapping local holds still yield
    description: A node whose local holds of one record keep overlapping stops taking new ones after its turn, so another node gets the record
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestOverlappingLocalHoldsStillYield

  - id: lock-torn-slot-expires
    name: Torn slot expires
    description: A slot that keeps failing its checksum stops blocking other nodes after tornExpiry
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestTornSlotExpires

  - id: lock-torn-slot-wait-restarts
    name: Torn slot wait restarts when its bytes change
    description: A node with an old torn sighting of a slot does not ignore it when the slot reads torn with other bytes, as a live write in flight does
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestTornSlotWaitRestartsWhenBytesChange

  - id: lock-own-slot-adoption-outlives-replay-acquire
    name: Own-slot adoption outlives the replay's acquires
    description: A node restarted into its own slot keeps the adopted claim there after its replay acquires and releases the record, until ReleaseAdopted
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestOwnSlotAdoptionOutlivesReplayAcquire

  - id: lock-replayer-wins-adopted-record
    name: Replayer wins an adopted record over a lower-slot waiter
    description: A waiter in a lower slot defers to an adopted slot, so the replayer gets the record instead of waiting behind the waiter
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestReplayerWinsAdoptedRecordOverLowerWaiter

  - id: lock-release-adopted-keeps-new-owner
    name: ReleaseAdopted keeps a new owner's claim
    description: A claim written by a node that registered into the dead node's slot survives ReleaseAdopted
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestReleaseAdoptedKeepsNewOwnersClaim

  - id: whole-sector-write-survives-peer-partial-write
    name: Whole-sector write survives a peer's partial write
    description: Node A's whole-sector write and node B's 1-byte write to the same sector at once; A's write is never lost to B's read-modify-write
    priority: go_only
    environments:
      go: internal/goclusterfs/lock_commit_test.go::TestWholeSectorWriteSurvivesPeerPartialWrite

  - id: write-when-inode-and-block-share-lock-record
    name: Write succeeds when the inode and block share a lock record
    description: A write into an existing block whose extent lock maps to the same lock record as the file's inode lock succeeds instead of failing as a shared-to-exclusive upgrade
    priority: go_only
    environments:
      go: internal/goclusterfs/lock_commit_test.go::TestWriteWhenInodeAndBlockShareLockRecord

  - id: lock-failing-holder-blocks-until-released
    name: Failing holder's claim blocks until its registry slot empties
    description: A claim older than the stale threshold keeps blocking while its node is failing, and frees once the node's registry slot is empty
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestFailingHoldersOldClaimBlocksUntilRegistrySlotEmpties

  - id: lock-wait-for-failing-holder-has-no-timeout
    name: Wait for a failing holder outlasts the lock timeout
    description: A wait for a failing holder's claim does not count toward the lock timeout and succeeds once the replay ends
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestWaitForFailingHolderOutlastsTimeout

  - id: lock-wait-for-live-holder-times-out
    name: Wait for a live holder still times out
    description: A wait for a live, heartbeating holder still gives up after the lock timeout
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestWaitForLiveHolderStillTimesOut

  - id: lock-wait-ends-when-replay-lapses
    name: Lock wait ends when the holder's replay lapses
    description: A wait for a failing holder gives up once the replay of its journal fails or is abandoned
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestWaitEndsWhenHoldersReplayLapses

  - id: lock-claim-frees-on-fresh-empty-registry-read
    name: Claim frees only on a fresh empty registry read
    description: A cached registry read showing the slot empty does not free a claim; only a read from the device after the row does
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestClaimFreesOnlyWhenFreshRegistryReadIsEmpty

  - id: lock-torn-slot-frees-with-registry-slot
    name: Torn lock slot frees when its registry slot empties
    description: A torn claim slot blocks while the node in its registry slot is failing and frees once that slot is empty
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestTornSlotFreesWhenItsRegistrySlotEmpties

  - id: lock-peers-wait-out-successor-replay
    name: Peers wait out a successor's replay of its predecessor
    description: A live node that took a dead node's registry slot keeps its predecessor's claims while it replays that journal, and peers wait without a timeout
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestPeersWaitOutLiveNodesReplayOfItsPredecessor

  - id: lock-replays-sharing-record-take-turns
    name: Replays sharing a lock record take turns
    description: Two nodes replaying dead nodes whose claims share a record do not wait on each other; the replay of the lower dead slot goes first
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestReplaysSharingRecordTakeTurns

  - id: lock-replay-keeps-live-replay-claims
    name: A replay does not pass over a live node's replay claims
    description: A node replaying a dead node in a lower slot stays out of a record that a live node, remounted into its own slot, holds as adopted while it replays its predecessor
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestReplayDoesNotPassOverLiveNodesReplayClaims

  - id: lock-clear-foreign-claims
    name: A mount clears an earlier occupant's claims in its slot
    description: After its replay, a node clears claims in its own slot that an earlier occupant left or that are torn, and keeps its own holds
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestClearForeignClaimsKeepsOwnHolds

  - id: lock-nested-wait-yields-to-replay
    name: Nested wait on a replaying node yields to the replay
    description: A peer that holds inode Y and waits for a dead node's adopted extent row gives up after the timeout, and the replay, which waits without a limit, takes Y and finishes
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestNestedWaitOnReplayingNodeYieldsToReplay

  - id: lock-retryable-nested-wait-returns-at-once
    name: Retryable nested wait on a failing holder returns at once
    description: A caller that can release its locks and retry gets ErrReplayBlocked, an ErrLockTimeout, at once instead of after the lock timeout
    priority: go_only
    environments:
      go: internal/lock/owner_test.go::TestRetryableNestedWaitOnFailingHolderReturnsAtOnce

  - id: in-place-write-steps-aside-for-replay
    name: In-place write steps aside for a replay
    description: An overwrite of a block whose lock a failed node held lets go of its inode lock, waits holding nothing while the replay takes the inode lock, then completes without EIO
    priority: go_only
    environments:
      go: internal/goclusterfs/replay_wait_test.go::TestInPlaceWriteStepsAsideForReplay

  - id: lock-long-hold-logged-once
    name: Long lock hold is logged once
    description: A node that holds a lock longer than a minute logs one warning naming the record and the key that holds it, since a claim never goes stale and a leaked hold lasts until unmount
    priority: go_only
    environments:
      go: internal/lock/holds_test.go::TestLongHoldIsLoggedOnce

  - id: lock-forget-adopted-keeps-claims
    name: A failed replay keeps the dead node's lock claims
    description: After a failed replay the replaying node forgets its adoptions but leaves the claims on the device, so peers and the failed replayer wait for a later replay
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestForgetAdoptedKeepsDeadNodesClaims

  - id: registry-failed-replay-keeps-locks
    name: Failure detection keeps a dead node's locks after a failed replay
    description: When the replay of a dead node's journal fails, the lock handler is told so and the registry slot stays dead with the failed node
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestFailedReplayKeepsDeadNodesLocks

  - id: mount-own-replay-retries-lock-wait
    name: Mount retries its own replay while another node holds a lock
    description: A mount whose own journal replay gives up waiting for another node's lock retries with backoff and replays the transaction once the lock frees
    priority: go_only
    environments:
      go: cmd/mount/recovery_test.go::TestOwnReplayRetriesWhileAnotherNodeHoldsALock

  - id: mount-own-replay-stops-at-bad-record
    name: Mount stops at a journal record that does not decode
    description: Any own-journal replay failure other than a lock wait returns at once without a retry, and mount fails with the -skip-recovery hint
    priority: go_only
    environments:
      go: cmd/mount/recovery_test.go::TestOwnReplayStopsAtARecordThatDoesNotDecode

  - id: registry-occupant-states
    name: Registry reports how each slot's node stands
    description: Occupant reports a live node, a failing or dead one under replay, a dead one whose replay lapsed, and an empty slot, and answers from the last read unless asked for a fresh one
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestOccupantReportsHowSlotStands

  - id: registry-occupant-cache
    name: Registry answers occupancy from its last read unless fresh
    description: Occupant answers from failure detection's last read of a slot, and reads the device when asked for a fresh answer
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestOccupantAnswersFromLastReadUnlessFresh

  - id: registry-previous-owner-of-taken-slot
    name: Register reports the previous owner of any taken slot
    description: Register reports the node whose failed slot it took, from any host, so mount keeps that node's lock claims through the replay
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestRegisterReportsPreviousOwnerOfAnyTakenSlot

  - id: storage-write-gate-refuses-writes
    name: Device write gate refuses writes
    description: A write the gate refuses fails with the gate's error and does not reach the device
    priority: go_only
    environments:
      go: internal/storage/device_test.go::TestWriteGateRefusesWrites

  - id: trim-discard-refused-by-write-gate
    name: Discard refused by the write gate
    description: A queued discard does not run when the device's write gate refuses it
    priority: go_only
    environments:
      go: internal/trim/trim_test.go::TestDiscardRefusedByWriteGate

  - id: registry-check-ownership-after-pause
    name: Ownership check after a pause writes a heartbeat
    description: When the last heartbeat is old, CheckOwnership writes a heartbeat and passes while the slot is still the node's
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestCheckOwnershipWritesHeartbeatAfterPause

  - id: registry-check-ownership-after-takeover
    name: Ownership check fails once the slot is taken over
    description: Once peers marked the slot dead, CheckOwnership returns ErrSlotLost and calls the slot-lost handler once
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestCheckOwnershipFailsOnceSlotIsTakenOver

  - id: registry-write-gate-after-takeover
    name: Write gate refuses data writes once the slot is lost
    description: With the registry's write gate on the device, a node whose slot was marked dead while it was paused cannot write outside the registry, and the write does not reach the device
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestWriteGateRefusesWritesOnceSlotIsLost

  - id: lock-leaked-shared-count-goes-stale
    name: Leaked read claim goes stale
    description: New readers do not refresh another node's read claim, so a read claim leaked by a stopped node stops blocking writers once it is 15 seconds old
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestNewReadersDoNotKeepLeakedSharedLockFresh

  - id: lock-slot-claims-exclude-under-slow-writes
    name: Slot claims exclude under slow writes
    description: Six nodes take one lock for writing and reading while every slot write takes up to 30ms; a writer never holds beside another holder
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestSlotClaimsExcludeUnderSlowWrites

  - id: lock-torn-slot-counts-as-claim
    name: Torn slot counts as a claim
    description: A claim slot that fails its checksum blocks the record until it is cleared
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestTornSlotCountsAsClaim

  - id: lock-slot-readers-share-writers-wait
    name: Readers share, writers wait
    description: Read claims on two nodes hold one record together; a write claim waits until both release
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestSlotReadersShareWritersWait

  - id: lock-contended-claims-all-finish
    name: Contended claims all finish
    description: Four nodes take one write lock 25 times each with no delays; every acquire finishes
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestContendedSlotClaimsAllFinish

  - id: lock-racing-claims-lower-slot-wins
    name: Racing claims, lower slot wins
    description: One node writes its claim and stalls before reading the row while another claims; the node in the lower slot gets the lock and the other waits for its release
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestRacingClaimsLowerSlotWins

  - id: lock-dead-claimant-blocks-until-stale
    name: Dead claimant blocks only until stale
    description: A claim left by a node that stopped mid-claim, in a lower or a higher slot, keeps a live node waiting only until the claim is 15 seconds old
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestDeadClaimantBlocksOnlyUntilStale

  - id: lock-abandoned-claim-cleared
    name: Abandoned claim is cleared
    description: A lower-slot node that gives up waiting clears the claim it kept, so a higher-slot node gets the lock as soon as the holder releases
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestAbandonedClaimIsCleared

  - id: lock-slow-slot-writes-no-freeze
    name: Slow slot writes cause no freeze
    description: With every slot write taking 333ms, two nodes still hand one lock back and forth four times without a stall
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestSlowSlotWritesCauseNoFreeze

  - id: lock-adopt-owner-renews-old-claim
    name: Takeover renews a dead node's old claim
    description: AdoptOwner writes a dead node's write claim again, so peers stay off the record until the replay ends even if the claim was already stale
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestAdoptOwnerRenewsDeadNodesOldClaim

  - id: lock-adopt-owner-clears-torn-slot
    name: Takeover clears a dead node's torn slot
    description: A torn slot in a dead node's registry slot never goes stale; AdoptOwner keeps it for the replay and ReleaseAdopted clears it
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestAdoptOwnerClearsDeadNodesTornSlot

  - id: lock-adopt-owner-own-slot
    name: Restarted node takes over its predecessor's claims
    description: A node restarted into its own registry slot keeps its predecessor's claims during the replay, then clears those it does not use itself
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestAdoptOwnerOfOwnSlotPredecessor

  - id: superblock-refuses-layout-without-lock-slots
    name: Mount refuses layout without lock slots
    description: A v3 image formatted before per-node lock slots, with a 1 MB lock region and no slot size, is refused with a message to reformat
    priority: go_only
    environments:
      go: internal/superblock/io_test.go::TestReadRejectsLayoutWithoutLockSlots

  - id: lock-cached-rejoin-no-disk-io
    name: Cached rejoin needs no disk I/O
    description: Re-acquiring a cached hold on the same node writes no slot and reads no row
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestCachedHoldRejoinNeedsNoDiskIO

  - id: lock-paused-node-drops-cached-hold
    name: Paused node drops a cached hold taken over
    description: A cached write hold older than renewAfter is released and acquired afresh, so a node waking from a pause does not reuse a record another node took over
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestPausedNodeDropsCachedHoldTakenOver

  - id: lock-release-cached
    name: Release cached holds
    description: ReleaseCached lets other nodes take kept records at once
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestReleaseCachedFreesHoldsAtOnce

  - id: lock-busy-node-yields
    name: Busy node yields a cached record
    description: A node that held a record past CacheGrace releases it when idle and waits YieldGap, so a waiting node gets it
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestBusyNodeYieldsCachedRecord

  - id: lock-concurrent-dir-reads-create
    name: Concurrent directory reads do not delay create or unlink
    description: Two nodes taking a shared claim on one directory at once leave no reader count behind, so a create or unlink there finishes within 2s
    priority: go_only
    environments:
      go: internal/goclusterfs/lock_commit_test.go::TestConcurrentDirReadsDoNotDelayCreateOrUnlink

  - id: lock-concurrent-refcount-reads-snapshots
    name: Concurrent refcount reads do not delay snapshots
    description: Two nodes reading refcounts at once leave no reader count behind, so snapshot create, copy-on-write and snapshot delete each finish within 2s
    priority: go_only
    environments:
      go: internal/goclusterfs/lock_commit_test.go::TestConcurrentRefcountReadsDoNotDelaySnapshots

  - id: lock-adopt-owner-clears-dead-reader
    name: Dead node's reader bit cleared on takeover
    description: AdoptOwner clears a proven-dead node's read slot, so a writer gets a record the dead node kept for reading
    priority: go_only
    environments:
      go: internal/lock/reclaim_test.go::TestAdoptOwnerClearsDeadReader

  - id: lock-acquire-without-deadline-gives-up
    name: Acquire without a deadline gives up
    description: An acquire whose context never ends returns ErrLockTimeout after DefaultTimeout instead of waiting forever
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestAcquireWithoutDeadlineGivesUp

  - id: lock-timeout-logs-holder
    name: Timed-out acquire logs the holder
    description: An acquire that gives up logs at WARN which node holds the record and how
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestTimedOutAcquireLogsHolder

  - id: lock-release-cached-parallel
    name: Unmount frees kept locks in parallel
    description: On slow storage ReleaseCached frees kept records in parallel, so 16 records take about as long as one
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestReleaseCachedWithSlowWritesRunsInParallel

  - id: lock-region-bounded
    name: Lock region stays bounded
    description: Many acquire/release cycles across resources and two nodes reuse the fixed region, leave no record held, and write nothing outside it
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestLockRegionStaysBoundedAcrossCycles

  # ===========================================================================
  # HTTP API (one process on one host; Docker and VM would test nothing more)
  # ===========================================================================

  - id: api-health-loopback
    name: API answers /health on loopback
    description: A mount started with -api-addr on 127.0.0.1 serves GET /health with 200
    priority: high
    environments:
      go: api_test.go::TestAPIServesHealthOnLoopback
      docker: TODO - the shell suites never query the HTTP API; needs curl in the test image and per-node -api-addr
      vm: TODO - same reason as docker; the Alpine VMs also need curl

  - id: api-refuses-remote-without-token
    name: Mount refuses an unauthenticated remote API
    description: With -api-addr on all interfaces and no -api-token, mount exits non-zero naming -api-token and never writes the device
    priority: go_only
    environments:
      go: api_test.go::TestMountRefusesUnauthenticatedRemoteAPI

  - id: mount-version-flag
    name: Mount prints its version
    description: goclusterfs-mount -version exits 0 and prints the version string
    priority: go_only
    environments:
      go: api_test.go::TestMountPrintsVersion

  - id: broadcast-secret-warning
    name: Mount warns about unauthenticated broadcast
    description: With broadcast on and no -broadcast-secret, mount logs a WARNING line; with a secret or -broadcast=false it does not
    priority: go_only
    environments:
      go: api_test.go::TestMountWarnsWithoutBroadcastSecret

  - id: api-settings-checked-before-device
    name: Mount rejects bad API settings early
    description: An -api-addr without a port, an invalid -api-cors, -api-cors * without a token, or an -api-rate-limit that is negative, NaN, infinite or too large stop mount before it opens the device
    priority: go_only
    environments:
      go: api_test.go::TestMountRejectsBadAPISettingsBeforeOpeningDevice

  # ===========================================================================
  # HTTP API writes (one mount on one host)
  # ===========================================================================

  - id: api-snapshot-lifecycle
    name: API snapshot, clone and delete
    description: The API creates, lists, clones and deletes snapshots and clones files through setxattr on the mount, the same path as setfattr; bad paths, names and destinations are refused
    priority: go_only
    environments:
      go: api_writes_test.go::TestAPISnapshotLifecycle

  - id: api-writes-off-without-token
    name: API writes need a token
    description: Without -api-token, write endpoints answer 403 and mount logs that writes are off; reads still work
    priority: go_only
    environments:
      go: api_writes_test.go::TestAPIWritesOffWithoutToken

  - id: api-writes-during-file-io
    name: API writes while files are written
    description: Snapshot, clone and delete requests run while other goroutines write and read the same files, with no deadlock, whole 4 KB chunks in every clone, and a clean fsck
    priority: go_only
    environments:
      go: api_writes_test.go::TestAPIWritesDuringFileIO

  - id: api-shutdown-during-snapshots
    name: Mount exits cleanly during API snapshots
    description: SIGTERM while snapshot requests run makes mount wait for them, unmount and exit 0, and fsck stays clean
    priority: go_only
    environments:
      go: api_writes_test.go::TestMountExitsCleanlyDuringSnapshots

  - id: api-admin-live-mount
    name: API admin endpoints on a live mount
    description: flush-journal, force-trim and clear-cache answer 200 on a mounted filesystem, which keeps working afterwards
    priority: go_only
    environments:
      go: api_writes_test.go::TestAPIAdminOnLiveMount

  - id: api-token-sources
    name: API token from a file or the environment
    description: Mount refuses a group- or world-readable -api-token-file and more than one token source, accepts GOCLUSTERFS_API_TOKEN, and warns when the token comes from -api-token
    priority: go_only
    environments:
      go: api_writes_test.go::TestMountTokenSources

  - id: dashboard-live-mount
    name: Web dashboard on a live mount
    description: /ui/ serves the same static shell with or without a token, with a strict Content-Security-Policy, while /api/v1/* still needs the token
    priority: go_only
    environments:
      go: dashboard_test.go::TestDashboardOnLiveMount

  - id: dashboard-flag-off
    name: -dashboard=false removes /ui/
    description: With -dashboard=false, /ui/ goes through the normal auth and answers 404
    priority: go_only
    environments:
      go: dashboard_test.go::TestDashboardFlagOff

  - id: gfsctl-reads-live-mount
    name: gfsctl reads a live mount
    description: gfsctl status, health and metrics work against a mounted filesystem's API
    priority: go_only
    environments:
      go: api_test.go::TestGfsctlReadsLiveMount

  - id: api-stats-live-values
    name: API stats report live values
    description: After writes, reads, a delete and a mkdir, /api/v1/stats/{cache,journal,lock,all,cluster} and /metrics show non-zero counters, TRIM reports itself disabled on an image file, /stats/sfb answers 404, and a second node sees both nodes and the first node's blocks
    priority: high
    environments:
      go: api_stats_test.go::TestAPIStatsReportLiveValues
      docker: TODO - same reason as api-health-loopback
      vm: TODO - same reason as api-health-loopback; a VM test could also check TRIM counts on a real virtio disk

  - id: stats-sampler-serves-snapshot
    name: Stats requests never call the managers
    description: Repeated StatsProvider and Capacity calls are served from the last snapshot; sources are read only by the sampler
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestSamplerAnswersFromSnapshotWithoutCallingSources

  - id: stats-sampler-refresh
    name: Stats sampler refreshes until stopped
    description: Counter and device samples pick up new values in the background; Stop is idempotent and no source is read after it
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestSamplerRefreshesInBackgroundUntilStopped

  - id: stats-sampler-idle
    name: Idle stats sampler leaves the device alone
    description: Without requests for capacity or cluster data, device ticks skip the bitmap and registry reads; the first such request starts a read at once
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestSamplerReadsDeviceOnlyWhenAsked

  - id: stats-cache-hit-rates
    name: Cache stats report hit rates as fractions
    description: Inode, extent, negative and lock hint cache stats carry sizes and counts, with hit rates from 0 to 1
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestCacheResponseReportsHitRatesAsFractions

  - id: stats-lock-journal
    name: Lock and journal stats
    description: Lock stats carry held and waiting counts; journal stats carry a lowercase state and the commit counters
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestLockAndJournalResponses

  - id: stats-trim
    name: TRIM stats
    description: TRIM stats convert discarded blocks to bytes and report the last discard time, empty before any discard
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestTrimResponseCountsBytesAndLastDiscard

  - id: stats-capacity
    name: Capacity from the block bitmap
    description: Capacity derives used blocks and bytes from total and free blocks, with 0% for an empty bitmap
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestCapacityInfo

  - id: stats-cluster-slots
    name: Cluster stats classify registry slots
    description: Cluster stats count non-empty slots, report the local node and list peers as active, stale or dead
    priority: go_only
    environments:
      go: internal/stats/sampler_test.go::TestClusterResponseClassifiesSlots

  - id: lock-stats-held-waiting
    name: Lock manager counts held and waiting locks
    description: Stats reports the holder's lock and a blocked Acquire on another node until the lock is released; an uncontended Acquire never counts as waiting
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestStatsCountsHeldAndWaitingLocks

  - id: trim-stats-errors
    name: TRIM counts failed discards
    description: A failed BLKDISCARD range counts as an error; a successful one sets the last discard time
    priority: go_only
    environments:
      go: internal/trim/trim_test.go::TestStatsCountFailedDiscardsAndLastSuccess

  - id: trim-unsupported-not-counted
    name: TRIM on a device that cannot discard
    description: EOPNOTSUPP or ENOTTY marks the device unsupported, stops the flush and counts nothing as discarded or failed
    priority: go_only
    environments:
      go: internal/trim/trim_test.go::TestUnsupportedDeviceIsNotCountedAsDiscarded

  - id: trim-refused-flush-error
    name: TRIM counts a flush the bitmap guard refused
    description: When the free-block guard fails, the flush discards nothing and DiscardErrors goes up by one
    priority: go_only
    environments:
      go: internal/trim/trim_test.go::TestRefusedFlushCountsAsError

  - id: api-metrics-capacity
    name: /metrics exports capacity
    description: With a status provider, /metrics exports goclusterfs_fs_size_bytes and goclusterfs_fs_free_bytes
    priority: go_only
    environments:
      go: internal/api/prometheus_test.go::TestMetricsEndpoint_ExportsCapacity

  - id: api-health-signal-shutdown
    name: /health checks and SIGTERM shutdown
    description: A live mount reports device, journal, recovery and broadcast checks on /health. SIGTERM with a file open under the mount stops the API, reports the busy unmount and keeps the mount; a second SIGTERM after the file is closed unmounts, exits 0 and leaves a clean fsck
    priority: high
    environments:
      go: shutdown_test.go::TestHealthAndSignalShutdown
      docker: TODO - same reason as api-health-loopback
      vm: TODO - same reason as api-health-loopback

  - id: commands-share-exit-codes
    name: mount, fsck and gfsctl share exit codes
    description: The three binaries exit 0 after -h, 16 on a bad flag or missing argument, and 8 when the device, mount point or API cannot be reached, and say what to do next
    priority: go_only
    environments:
      go: shutdown_test.go::TestCommandsShareExitCodes

  - id: api-stop-waits-for-requests
    name: API Stop lets requests in flight finish
    description: Stop closes the listener at once, waits for a request in flight, and leaves no server goroutines
    priority: go_only
    environments:
      go: internal/api/lifecycle_test.go::TestStopLetsRequestsInFlightFinish

  - id: api-stop-cancels-after-timeout
    name: API Stop cancels requests after the shutdown timeout
    description: A request that outlasts ShutdownTimeout has its context cancelled, Stop returns ErrShutdownTimeout only after the handler returns, and no server goroutines are left
    priority: go_only
    environments:
      go: internal/api/lifecycle_test.go::TestStopCancelsRequestsThatOutlastTheTimeout

  - id: api-stop-idle
    name: API Stop on an idle server
    description: Stop is idempotent, refuses new connections and leaves no server goroutines
    priority: go_only
    environments:
      go: internal/api/lifecycle_test.go::TestStopIdleServer

  - id: mount-health-degraded-vs-down
    name: /health separates degraded from down
    description: A peer journal replay or broadcast trouble reports degraded with 200; a failing device or corrupt journal reports unhealthy with 503; -journal=false and -broadcast=false stay ok
    priority: go_only
    environments:
      go: cmd/mount/health_test.go::TestHealthChecksSeparateDegradedFromDown

  - id: storage-last-error
    name: Device remembers its last I/O failure
    description: LastError holds the latest failed read, write or sync until one succeeds, and ignores EOF
    priority: go_only
    environments:
      go: internal/storage/device_test.go::TestLastErrorHoldsTheLatestFailureUntilASuccess

  - id: node-replaying-slots
    name: Registry lists the journals it replays
    description: Replaying lists a slot while its recovery handler runs and drops it afterwards, even when the replay fails
    priority: go_only
    environments:
      go: internal/node/replaying_test.go::TestReplayingListsSlotsWhileTheirHandlerRuns

  - id: broadcast-problem
    name: Broadcast reports why peers miss invalidations
    description: Problem names a stopped transport, a failed send, and missing multicast without unicast peers, and is empty when broadcast is off or working
    priority: go_only
    environments:
      go: internal/cache/broadcast/problem_test.go::TestProblemSaysWhyPeersMissInvalidations

  - id: cli-parse-flags
    name: Shared flag parsing exit codes
    description: -h exits 0 and a bad flag or value exits 16; -debug and --debug both parse
    priority: go_only
    environments:
      go: internal/cli/cli_test.go::TestParseFlagsExitCodes

  - id: logging-debug-switch
    name: Debug lines only with -debug
    description: Debugf prints [DEBUG] lines only after SetDebug(true)
    priority: go_only
    environments:
      go: internal/logging/logging_test.go::TestDebugfPrintsOnlyWhenOn

  - id: gfsctl-exit-codes
    name: gfsctl exit codes and hints
    description: health exits 0, 1 or 4 for ok, degraded and unhealthy (decoding the 503 body), API and connection errors exit 8 with a hint, usage errors exit 16 with a --help hint
    priority: go_only
    environments:
      go: cmd/gfsctl/commands/errors_test.go::TestExitCodesAndHints

  - id: gfsctl-debug
    name: gfsctl --debug logs requests
    description: --debug logs each API request with its status; without it nothing is logged
    priority: go_only
    environments:
      go: cmd/gfsctl/commands/errors_test.go::TestDebugLogsEachRequest

  - id: dir-setattr-keeps-mkdir
    name: Directory chmod keeps another node's mkdir
    description: Node A changes a directory's mode while node B makes a directory in it; the link count and mtime from node B survive
    priority: go_only
    environments:
      go: internal/goclusterfs/setattr_race_test.go::TestDirSetattrKeepsOtherNodesMkdir

  - id: file-setattr-keeps-size
    name: File chmod keeps another node's size
    description: Node A changes a file's mode while node B appends inside the file's allocated block; node B's size and data survive
    priority: go_only
    environments:
      go: internal/goclusterfs/setattr_race_test.go::TestFileSetattrKeepsOtherNodesSize

  - id: logging-no-ungated-debug
    name: No [DEBUG] line bypasses -debug
    description: No non-test Go file calls log.Printf or log.Println with a [DEBUG] prefix; they go through logging.Debugf
    priority: go_only
    environments:
      go: internal/logging/guard_test.go::TestDebugLinesGoThroughDebugf

  - id: dir-index-other-node-changes
    name: Directory index follows another node's adds and removes
    description: Node A's cached index answers for node B's add and remove on the next lookup, with no message between the nodes
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestLookupSeesOtherNodesChanges

  - id: dir-index-remove-generation
    name: Remove bumps the directory generation before returning
    description: After RemoveIf returns and before the child is freed, no node's cached index still names the child
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestRemoveIfWritesDirectoryInodeBeforeReturning

  - id: dir-index-add-validates
    name: Add checks a cached index against the disk
    description: Node A's add under the directory lock sees node B's entry in the same chunk; the duplicate fails and the new entry does not overwrite it
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestAddValidatesIndexAgainstDisk

  - id: dir-index-limit
    name: Directory indexes stay under the name limit
    description: Indexes past the limit drop the least recently used directory, lookups there still work, and a limit of 0 keeps none
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestIndexLimitEvictsLeastRecentlyUsed

  - id: dir-index-torn-inode
    name: An unreadable directory inode never validates an index
    description: When the directory inode fails its checksum, as a torn read would, the cached index does not answer
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestCachedLookupRejectsUnreadableInode

  - id: dir-index-keep
    name: Directory index survives inode-only writes
    description: After an mtime or link count write under the directory lock, the index answers without a rebuild; any other write still forces one
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestKeepIndexFollowsInodeOnlyWrites

  - id: dir-same-node-edits
    name: Same-node entry changes keep every entry
    description: Goroutines on one node add and remove names in one directory at once; the disk and the node's index agree and lose nothing
    priority: go_only
    environments:
      go: internal/dir/index_test.go::TestSameNodeEditsKeepEveryEntry

  - id: shutdown-slow-step-logged
    name: Slow shutdown step is logged
    description: A shutdown step that takes longer than the limit logs its name and duration, and a quick one logs nothing
    priority: go_only
    environments:
      go: internal/goclusterfs/shutdown_test.go::TestOnlySlowShutdownStepsAreLogged

  - id: shutdown-stall-dumps-goroutines
    name: Stalled shutdown dumps goroutines
    description: A shutdown still running past the limit logs every goroutine's stack once, and one that ends first logs nothing
    priority: go_only
    environments:
      go: internal/goclusterfs/shutdown_test.go::TestStalledShutdownLogsGoroutines

  - id: shutdown-watch-ends-on-failed-unmount
    name: Shutdown watch ends when an unmount fails
    description: An ended shutdown watch logs no goroutine dump, and the next shutdown starts a new watch that dumps once
    priority: go_only
    environments:
      go: internal/goclusterfs/shutdown_test.go::TestEndedShutdownWatchDoesNotDump
