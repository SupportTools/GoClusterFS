      vm: run-vm-tests.sh::test_journal_recovery_multinode

  - id: multinode-restart-keeps-peer-journal
    name: Restart while a peer writes keeps the peer's journal
    description: Node A crashes and restarts while node B creates files. A takes back its own registry slot and journal, does not replay or reset B's live journal, and B's files stay readable. The Go test also crashes B and checks A replays B's journal from B's slot.
    priority: critical
    environments:
      go: journal_slots_test.go::TestMultiNodeRestartKeepsPeerJournal
      docker: run-tests.sh::test_restart_keeps_peer_journal
      vm: run-vm-tests.sh::test_restart_keeps_peer_journal

  - id: mount-refuses-legacy-layout
    name: Mount refuses the pre-v2 shared-journal layout
    description: Mount exits with a clear message on an image formatted before per-node journals instead of misreading it
    priority: go_only
    environments:
      go: journal_slots_test.go::TestMountRefusesLegacyLayout

  - id: mount-refuses-layout-v2
    name: Mount and fsck refuse layout v2
    description: On a v2 image, whose fixed 1 MB regions hold 4096 inodes and overflow refcounts past 128 GB, mount and fsck exit with a message to copy the data off and reformat
    priority: go_only
    environments:
      go: layout_test.go::TestMountRefusesLayoutV2

  - id: more-than-4096-files
    name: More than 4096 files
    description: Every node creates its share of 4200 files in 42 directories at once on a volume with more than 4200 inodes, and all of them are visible; layout v2 held 4096 inodes
    priority: high
    environments:
      go: layout_test.go::TestLargeVolume
