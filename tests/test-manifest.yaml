    name: Four nodes create 4200 files in one directory
    description: Four nodes each create 1050 empty files in one shared directory at the same time; every create succeeds and one node lists all 4200
    priority: medium
    # Docker/VM: test_more_than_4096_files already runs 4200 concurrent creates on 4 nodes, spread over 42 directories.
    environments:
      go: dir_capacity_test.go::TestMultiNodeCreatesInOneDirectory
      docker: TODO
      vm: TODO

  - id: large-volume-high-block-snapshot
    name: 200 GB volume with snapshots of data past 128 GB
    description: On a 200 GB sparse image, a snapshot, copy on write and clone of data past block 130816, where layout v2's refcount table ended, survive a remount next to 4200 files, and fsck is clean
    priority: high
    environments:
      go: layout_test.go::TestLargeVolume
      docker: TODO  # needs a 200 GB sparse shared image; the Docker cluster shares a 768 MB image
      vm: TODO  # needs a 200 GB sparse shared disk; the VM cluster shares a 1 GB disk

  - id: crashed-peer-journal-replay
    name: Peer replays a crashed node's journal from its slot
    description: After node B crashes, node A finds B's journal through B's registry slot and replays it
    priority: high
    environments:
      go: journal_slots_test.go::TestMultiNodeRestartKeepsPeerJournal
      docker: TODO  # needs node log access after a 20s failure-detection wait; the Go test covers it
      vm: TODO  # same as docker

