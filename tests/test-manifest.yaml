  # ---------------------------------------------------------------------------
  # Intent Logging Tests (Two-Phase Commit Protocol)
  # ---------------------------------------------------------------------------
  # Intent logging ensures operations are logged BEFORE execution.
  # The two-phase protocol: Commit (INTENT POINT) → Execute → CompleteIntent (COMPLETION POINT)
  # Recovery replays only transactions without matching completion records.

  - id: intent-completion-serialize
    name: IntentCompletion serialization
    description: IntentCompletion record serializes and deserializes correctly
    priority: go_only
    environments:
      go: internal/journal/intent_test.go::TestIntentCompletionSerializeDeserialize

  - id: intent-completion-bad-magic
