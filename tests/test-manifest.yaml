# Test Manifest for GoClusterFS
# This file is the single source of truth for test coverage across all environments.
#
# Priority levels:
#   critical - CI fails if missing from any required environment
#   high     - CI warns, should be addressed
#   medium   - Tracked but optional
#   go_only  - Unit tests, not applicable to Docker/VM
#   vm_only  - Requires VM features (power failure, O_DIRECT)
#   docker_only - Docker-specific tests
#
# Environment format: filename::FunctionName
#   go:     integration_test.go::TestFunctionName
#   docker: run-tests.sh::test_function_name
#   vm:     run-vm-tests.sh::test_function_name
#
# Use TODO to mark tests that need to be implemented

version: 1

