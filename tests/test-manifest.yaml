  # ---------------------------------------------------------------------------
  # Intent Logging Tests (Two-Phase Commit Protocol)
  # ---------------------------------------------------------------------------
  # Intent logging ensures operations are logged BEFORE execution.
  # The two-phase protocol: Commit (INTENT POINT) → Execute → CompleteIntent (COMPLETION POINT)
  # Recovery replays only transactions without matching completion records.

  - id: journal-batch-sync-error
    name: Batched commit reports a failed sync
    description: A commit in batch mode returns the error of the batch sync it waited for instead of nil
    priority: go_only
    environments:
      go: internal/journal/journal_test.go::TestBatchCommitReturnsSyncError

  - id: journal-stop-failed-flush
    name: Stop reports a failed final flush
    description: Journal Stop returns the error of a final batch flush that failed, the waiting commit gets it too, and a second Stop does nothing
    priority: go_only
    environments:
      go: internal/journal/journal_test.go::TestStopReportsFailedBatchFlush

  - id: checkpoint-keeps-incomplete-intents
    name: Checkpoints never pass an intent that has not completed
    description: A transaction committed but not yet applied stays in the journal through a checkpoint and an unmount, and the next mount replays it; completed intents are checkpointed away
    priority: go_only
    environments:
      go: internal/journal/checkpoint_test.go::TestCheckpointKeepsIncompleteIntents

  - id: pending-intent-survives-full-ring
    name: A full journal never overwrites a pending intent
    description: While one intent pins the head, other operations fill the ring until Commit returns ErrJournalFull; the ring never ends at the head, where it would read as empty, and a crash still replays the pending intent
    priority: go_only
    environments:
      go: internal/journal/checkpoint_test.go::TestPendingIntentSurvivesFullRing

  - id: recovery-ends-with-tail-at-end
