    # Docker/VM TODO: snapshot and clone tests need xattr support in those harnesses, like the other snapshot scenarios.
    environments:
      go: extent_tree_test.go::TestExtentTreeSnapshot
      docker: TODO
      vm: TODO

  - id: extent-tree-unit
    name: Extent tree operations
    description: Spill, depth-2 growth, splits, folding back inline, and a randomized model check with reloads
    priority: go_only
    environments:
      go: internal/extent/tree_test.go::TestTreeMatchesModel

  - id: extent-tree-crash-safety
    name: Extent tree crash safety
    description: Tree nodes written without the inode write leave the committed tree readable
    priority: go_only
    environments:
      go: internal/extent/tree_test.go::TestFlushWithoutInodeWriteKeepsCommittedTree

  - id: extent-tree-truncate-conflict
    name: Truncate that loses a conflict
    description: A truncate whose inode write loses to another node's extent change frees nothing, and its retry frees each block once
    priority: go_only
    environments:
      go: internal/extent/tree_test.go::TestConflictingInlineTruncateRetryFreesOnce

  - id: extent-tree-journal-replay
    name: Journal replay into extent tree
    description: Replaying a committed ExtentAdd after a crash inserts into an existing extent tree
    priority: go_only
    environments:
      go: internal/journal/cross_node_recovery_test.go::TestApplyExtentAddIntoTree

  - id: extent-tree-write-path
    name: Write path beyond two extents
    description: File.Write handles sparse writes and interleaved appends without EAGAIN and survives a remount
    priority: go_only
    environments:
      go: internal/goclusterfs/extent_tree_test.go::TestWriteBeyondTwoExtents

  - id: extent-tree-directory
    name: Directory grows past inline extents
    description: A directory gaining a fourth non-contiguous block moves to an extent tree while its inode lock is held, using tree blocks reserved before the lock
    priority: go_only
    # Docker/VM: a directory needs over 3MB of entries to reach 3 blocks, too slow for those suites.
    environments:
      go: internal/dir/dir_test.go::TestDirectoryGrowsPastInlineExtentsUnderLocks

  - id: dir-block-uses-every-chunk
    name: Directory block uses every 4KB chunk
    description: 600 entries with 255-byte names fill many chunks of the first 1MB directory block instead of taking a new block every 15 entries, and every chunk's records add up to 4KB
    priority: go_only
    environments:
      go: internal/dir/dir_test.go::TestBlockUsesEveryChunk

  - id: dir-remove-first-entry-of-chunk
    name: Removing a chunk's first entry keeps records inside the chunk
    description: Removing the first entry of a later chunk does not extend the previous chunk's last record across the boundary, and the space is reused
    priority: go_only
    environments:
      go: internal/dir/dir_test.go::TestRemoveFirstEntryOfChunk

  - id: dir-add-stale-reclen
    name: Directory add ignores a stale record length
    description: An entry whose RecLen a failed new-block attempt left at 4KB still fits in a partly used chunk
    priority: go_only
    environments:
      go: internal/dir/dir_test.go::TestAddToChunkIgnoresStaleRecLen

  - id: extent-tree-fsck
    name: fsck validates extent trees
    description: fsck accepts a valid extent tree and reports a corrupted node
    priority: go_only
    environments:
      go: internal/fsck/fsck_test.go::TestFsckExtentTree

  - id: fsck-runtime-image
    name: fsck passes a runtime image
    description: An image the mount binary wrote, with snapshots, clones, copies on write and extent trees, passes goclusterfs-fsck with no problems; -repair exits 8 while mounted and 0 after a clean unmount
    priority: high
    # Docker/VM: their images do not ship goclusterfs-fsck. The Go test runs both binaries against a real mount.
    environments:
      go: fsck_test.go::TestFsckCleanAfterWorkload
      docker: TODO
      vm: TODO

  - id: fsck-repair-older-sharing
    name: fsck -repair counts sharing from older versions
    description: Snapshots of a file an older version shared fail with ENOTSUP; -repair -dry-run changes nothing, -repair exits 1, and snapshots, clones and copies on write work afterwards
    priority: high
    # Docker/VM: their images do not ship goclusterfs-fsck. The Go test runs both binaries against a real mount.
    environments:
      go: fsck_test.go::TestFsckRepairsOlderSharing
      docker: TODO
      vm: TODO

  - id: fsck-release-dead-slot
    name: fsck releases a dead node's slot
    description: -release-slot exits 8 while the node is mounted; after the node dies with a damaged journal header, -list-slots shows the damage, -release-slot prints what it discards without writing, -discard-journal frees the slot, and a mount then uses it
    priority: high
    # Docker/VM: their images do not ship goclusterfs-fsck. The Go test runs both binaries against a real mount.
    environments:
      go: fsck_test.go::TestFsckReleasesDeadSlot
      docker: TODO
      vm: TODO

  - id: fsck-runtime-image-unit
    name: fsck accepts everything the runtime writes
    description: Snapshots, clones, snapshot clones, copies on write in inline and tree files, deletes and unlinks leave no fsck problem
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_test.go::TestFsckAcceptsRuntimeImage

  - id: fsck-repair-older-tree-sharing
    name: fsck -repair counts older sharing in extent trees
    description: Older sharing in inline and extent tree files, including a block shared between a tree file and an inline clone, is rebuilt and marked counted
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_test.go::TestFsckRepairsOlderSharing

  - id: fsck-sharing-past-refcount-table
    name: fsck reports sharing the refcount table cannot count
    description: With the refcount table of a 200 GiB volume shrunk to 1 MB in the superblock, fsck reports an error that it covers blocks 0-130815, reports Critical for a higher block that several inodes share with counts, and repair leaves older uncounted sharing of such blocks uncounted
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_test.go::TestFsckReportsSharingPastRefcountTable

  - id: fsck-rebuild-refcount-sector
    name: fsck -repair rebuilds a corrupt refcount sector
    description: A refcount sector with a bad checksum is rebuilt from the extents that map its blocks
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_test.go::TestFsckRebuildsCorruptRefcountSector

  - id: fsck-reclaim-leaked-blocks
    name: fsck -repair frees leaked blocks
    description: A failed write and frees that gave up on a lock leave blocks no inode maps, one with a refcount of 2; check reports them, a dry run changes nothing, repair frees them and clears the count, a second repair changes nothing, and files, snapshots and clones keep their data and counts
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairReclaimsLeakedBlocks

  - id: fsck-reclaim-interrupted-truncate
    name: fsck -repair frees blocks an interrupted truncate leaves
    description: A node crashes after a truncate writes the shorter inode but before it frees the cut blocks; check reports whatever cut blocks replay leaves allocated, repair frees exactly those, and both files keep their data. Passes too if replay frees them itself
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairReclaimsInterruptedTruncate

  - id: fsck-reclaim-interrupted-subdirectory-unlink
    name: fsck -repair frees blocks an interrupted subdirectory unlink leaves
    description: A node crashes while unlinking a file in a subdirectory, after the entry is gone but before the blocks are freed; replay deletes the inode, check reports whatever of its blocks replay leaves allocated, repair frees exactly those, and other files keep their data. Passes too if replay frees them itself
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairReclaimsInterruptedSubdirectoryUnlink

  - id: fsck-repair-frees-unnamed-inode
    name: fsck -repair frees an inode replay leaves unnamed
    description: An unlink removes the name and crashes while another node, which has the file open, holds the inode lock; that node then writes the inode, so replay skips the unlink's ExtentFree and InodeDelete. Check reports the unnamed inode, a dry run changes nothing, repair frees it with its data and extent-tree blocks without calling them leaked, and other files keep their data
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_unnamed_test.go::TestFsckRepairFreesInodeReplayLeftUnnamed

  - id: fsck-repair-unnamed-keeps-clone-blocks
    name: fsck -repair frees an unnamed inode and leaves its blocks to a clone
    description: Replay leaves a cloned file unnamed; repair frees the inode, the shared blocks stay allocated with a refcount of 1, and the clone keeps its data
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_unnamed_test.go::TestFsckRepairFreesUnnamedInodeKeepsCloneBlocks

  - id: fsck-repair-keeps-unnamed-snapshot-target
    name: fsck -repair keeps an unnamed inode a snapshot refers to
    description: Replay leaves a file with a snapshot unnamed; repair reports why it keeps the inode and leaves the bitmap, refcounts and inode table unchanged
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_unnamed_test.go::TestFsckRepairKeepsUnnamedSnapshotTarget

  - id: fsck-repair-keeps-unnamed-it-cannot-place
    name: fsck -repair keeps unnamed inodes it must not free
    description: Repair frees an unnamed file, an unnamed empty directory and a snapshot data inode no snapshot refers to, keeps a reserved inode and a directory that is not empty, and keeps every unnamed inode when a phase is skipped or a directory or snapshot descriptor is damaged
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_unnamed_test.go::TestFsckRepairKeepsUnnamedInodesItCannotPlace

  - id: fsck-reclaim-empty-sfb-containers
    name: fsck -repair frees SFB containers no file uses
    description: A file that grows out of its SFB slot leaves its container empty; check reports it as leaked, repair frees it and keeps a container another file still uses, and both files keep their data
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairFreesEmptySFBContainers

  - id: fsck-reclaim-keeps-unplaced-leaks
    name: fsck -repair keeps leaked blocks it cannot place
    description: An unreadable inode, a damaged extent tree, a skipped bitmap or inode phase, a bad bitmap sector, a mounted node, or a dirty journal under -force makes repair keep leaked blocks and their refcounts and say why
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairKeepsLeaksItCannotPlace

  - id: fsck-reclaim-odd-extents
    name: fsck -repair keeps blocks of extents the runtime still maps
    description: Repair keeps the block of an extent without the allocated flag and the in-range block of an extent that runs past the device end
    priority: go_only
    environments:
      go: internal/goclusterfs/fsck_reclaim_test.go::TestFsckRepairKeepsBlocksOfOddExtents

  - id: fsck-repair-after-power-failure
    name: fsck -repair after a power failure
    description: A VM killed while writing files, then every node unmounted; fsck -repair exits 0 or 1, the check after it reports no leaked blocks, and a file written before the failure is unchanged on both nodes
    priority: vm_only  # needs a real power failure and goclusterfs-fsck inside the VMs
    environments:
      vm: run-vm-tests.sh::test_fsck_repair_after_power_failure

  - id: cow-write-power-failure
    name: Power failure during copy-on-write writes to a snapshotted file
    description: Power fails at each device write of a write that copies blocks a snapshot shares; after replay fsck finds only leaks, which repair fixes, each block holds its old or new data and the snapshot is unchanged. The VM test rewrites blocks with fsync until a power failure and checks every acknowledged write
    priority: high
    environments:
      go: internal/goclusterfs/power_cut_test.go::TestPowerCutDuringCopyOnWrite
      docker: TODO  # a container stop flushes the page cache and cannot cut power
      vm: run-vm-tests.sh::test_cow_write_power_failure

  - id: snapshot-create-delete-power-failure
    name: Power failure while snapshots are created and deleted
    description: Power fails at each device write of a snapshot create, and of a delete with its background job; the file and other snapshots keep their data and the snapshot is either gone or complete. The VM test creates and deletes snapshots until a power failure and checks each acknowledged step
    priority: high
    environments:
      go: internal/goclusterfs/power_cut_test.go::TestPowerCutDuringSnapshotCreate
      docker: TODO  # a container stop flushes the page cache and cannot cut power
      vm: run-vm-tests.sh::test_snapshot_create_delete_power_failure

  - id: snapshot-delete-power-failure-go
    name: Power failure at each write of a snapshot delete
    description: Power fails at each device write of a snapshot delete and its background job; the file and the other snapshot keep their data and the deleted snapshot is either gone or intact
    priority: go_only
    environments:
      go: internal/goclusterfs/power_cut_test.go::TestPowerCutDuringSnapshotDelete

  - id: clone-power-failure-go
    name: Power failure at each write of a clone
    description: Power fails at each device write of a clone; the source keeps its data and the clone is either gone or a full copy, and fsck finds only leaks
    priority: go_only
    environments:
      go: internal/goclusterfs/power_cut_test.go::TestPowerCutDuringClone

  - id: trim-reuse-power-failure
    name: Power failure between freeing blocks and discarding them
    description: Power fails at each device write of an unlink whose blocks TRIM has queued; after replay a new file reuses the blocks and TRIM flushes with discards that punch holes, and no file loses data. The VM test, with discard passed to the shared disk, removes and rewrites files until a power failure and checks every acknowledged file
    priority: high
    environments:
      go: internal/goclusterfs/power_cut_test.go::TestPowerCutDuringUnlinkThenTrimAfterReuse
      docker: TODO  # a container stop flushes the page cache and cannot cut power
      vm: run-vm-tests.sh::test_trim_reuse_power_failure

  - id: journal-torn-tail
    name: Recovery stops at a torn last transaction
    description: The last sector of a multi-sector transaction never lands; recovery replays the transactions before it and stops
    priority: go_only
    environments:
      go: internal/journal/torn_tail_test.go::TestRecoverStopsAtTornLastTransaction

  - id: journal-stale-record-after-tail
    name: Recovery ignores a stale record where a lost one should be
    description: The superblock covering a new record lands but the record does not, leaving a record from the previous mount or the previous lap in its place; recovery must not replay it
    priority: go_only
    environments:
      go: internal/journal/stale_record_test.go::TestRecoverIgnoresRecordFromEarlierMount

  - id: journal-stale-record-previous-lap
    name: Recovery ignores a same-size record from the journal's previous lap
    description: The record a lost one should replace is a transaction of the same size from the same mount's previous lap; only its seq tells it apart, and recovery must not replay it
    priority: go_only
    environments:
      go: internal/journal/record_order_test.go::TestRecoverIgnoresSameSizeRecordFromEarlierLap

  - id: journal-stale-completion
    name: Recovery ignores a completion from an earlier mount
    description: An intent's completion is lost, and the previous mount's completion of the intent with the same seq is in its place; recovery still replays the intent
    priority: go_only
    environments:
      go: internal/journal/record_order_test.go::TestRecoverIgnoresCompletionFromEarlierMount

  - id: journal-commit-order
    name: Recovery replays transactions committed out of Begin order
    description: A transaction that began later commits first; both are replayed, since a record's seq is the order it was written in
    priority: go_only
    environments:
      go: internal/journal/record_order_test.go::TestRecoverReplaysCommitsOutOfBeginOrder

  - id: journal-version-1-replay
    name: Recovery reads a version 1 journal as older builds wrote it
    description: A dirty version 1 journal numbers records in Begin order and uses IntentCompletion records; recovery replays its incomplete transactions
    priority: go_only
    environments:
      go: internal/journal/record_order_test.go::TestRecoverReplaysVersion1Journal

  - id: fsck-repair-in-use
    name: fsck -repair refuses an in-use filesystem
    description: -repair refuses while a node heartbeats or a stopped node's journal is dirty; -force overrides only the journal check; dry runs and checks still run
    priority: go_only
    environments:
      go: internal/fsck/layout_test.go::TestFsckRepairRefusesInUseFilesystem

  - id: fsck-release-slot
    name: fsck slot release checks
    description: Release refuses while any node runs or the slot's heartbeat or recovery lease is recent; an expired slot with a damaged journal is released, its journal reads as never initialized, and a new node registers in it
    priority: go_only
    environments:
      go: internal/fsck/slots_test.go::TestReleaseSlot

  - id: fsck-release-slot-refusals
    name: fsck slot release refusals
    description: Release refuses a slot number the registry lacks (ErrNoSuchSlot), a journal a mount can replay unless forced, an unreadable slot, and a superblock mount would reject
    priority: go_only
    environments:
      go: internal/fsck/slots_test.go::TestReleaseSlotRefusals

  - id: fsck-release-slot-lease
    name: fsck slot release holds the recovery lease
    description: A node that takes the slot before fsck's lease stops the release with the journal untouched; a node mounting during the lease takes another slot; a slot written during the lease is reported as reset but not free
    priority: go_only
    environments:
      go: internal/fsck/slots_test.go::TestReleaseSlotLease

  - id: fsck-release-slot-crash
    name: fsck slot release survives a crash
    description: After fsck crashes holding the lease, before or after the journal reset, mounts and peers skip the slot until the lease lapses; then a peer fails on the untouched damaged journal, or frees the slot after replaying the reset one
    priority: go_only
    environments:
      go: internal/fsck/slots_test.go::TestReleaseSlotCrash

  - id: release-slot-slow-reset
    name: Slot release gives up on a slow journal reset
    description: When the journal reset outlasts half the recovery lease, ReleaseSlot leaves the slot dead under its lease instead of freeing it
    priority: go_only
    environments:
      go: internal/node/registry_test.go::TestReleaseSlotGivesUpOnSlowReset

  - id: fsck-bad-layout
    name: fsck stops on a layout it cannot trust
    description: A zero inode size, no or too many data blocks, a wrapping offset or overlapping regions abort fsck in phase 1 with exit code 8
    priority: go_only
    environments:
      go: internal/fsck/layout_test.go::TestFsckStopsOnBadLayout

  - id: fsck-exit-codes
    name: fsck exit codes
    description: fsck(8) bits - 0 no errors, 1 repaired, 4 errors remain, 8 aborted, and their sums
    priority: go_only
    environments:
      go: internal/fsck/layout_test.go::TestFsckExitCodes

  - id: fsck-fuzz-check
    name: Fuzz fsck over corrupted metadata
    description: A corrupted superblock, bitmap, inode, registry, refcount, snapshot, extent tree or directory sector never panics a check or a repair dry run
    priority: go_only
    environments:
      go: internal/fsck/check_fuzz_test.go::FuzzCheck

  - id: fsck-fuzz-parsers
    name: Fuzz fsck record and directory parsers
    description: Arbitrary bytes never panic the fsck directory block and record parsers
    priority: go_only
    environments:
      go: internal/fsck/parse_fuzz_test.go::FuzzParseDirBlock

  - id: fsck-repair-node-mounting
    name: fsck -repair stops when a node mounts
    description: A node that mounts while repair watches the registry, or after the watch but before repair writes, stops the repair with exit code 8 and nothing written
    priority: go_only
    environments:
      go: internal/fsck/layout_test.go::TestFsckRepairNoticesNodeMounting

  - id: fsck-directory-chunk
    name: fsck checks every directory chunk
    description: In each 4KB chunk of a directory block, entries whose record lengths stop short of or run past the chunk are reported; unused chunks are skipped
    priority: go_only
    environments:
      go: internal/fsck/parse_fuzz_test.go::TestParseDirBlockChunkBoundary

  - id: fsck-fuzz-records
    name: Fuzz fsck fixed-size record parsers
    description: Arbitrary bytes never panic the superblock, inode, refcount and snapshot descriptor parsers
    priority: go_only
    environments:
      go: internal/fsck/parse_fuzz_test.go::FuzzParseRecords

  - id: extent-tree-node-fuzz
    name: Fuzz the extent tree node decoder
    description: Arbitrary bytes never panic the tree node decoder, and decoded nodes survive an encode/decode round trip
    priority: go_only
    environments:
      go: internal/extent/tree_fuzz_test.go::FuzzParseTreeNode

