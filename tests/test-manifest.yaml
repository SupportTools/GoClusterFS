    description: Recovery skips transactions with matching completion records
    priority: high
    environments:
      go: internal/journal/intent_test.go::TestRecoveryWithIntentCompletion
      docker: TODO  # Would require simulating crash with partial execution
      vm: TODO      # Better suited for VM testing with actual crash simulation

  # ===========================================================================
  # EXTENT TREES (files with more than 2 extents)
  # ===========================================================================
  # Inodes hold 2 extents inline; more move into an overflow tree of 1MB nodes.

  - id: extent-tree-sparse-writes
    name: Sparse writes beyond inline extents
    description: Writes at scattered offsets create more than 2 extents; data reads back before and after remount
    priority: critical
    environments:
