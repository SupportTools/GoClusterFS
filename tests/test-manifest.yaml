  - id: intent-completion-too-short
    name: IntentCompletion buffer validation
    description: Short buffer is detected and rejected
    priority: go_only
    environments:
      go: internal/journal/intent_test.go::TestIntentCompletionTooShort

  - id: intent-completion-magic-value
    name: IntentCompletion magic value
    description: Magic constant is correct (0x43544E49 "INTC")
    priority: go_only
    environments:
      go: internal/journal/intent_test.go::TestIntentCompletionMagic

  - id: intent-completion-timestamp
    name: IntentCompletion timestamp accuracy
    description: Timestamp is set correctly at creation time
