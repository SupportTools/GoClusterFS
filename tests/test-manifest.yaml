    description: A crash with the journal tail exactly at the end of the data area replays the pending transaction and returns, instead of scanning forever
    priority: go_only
    environments:
      go: internal/journal/checkpoint_test.go::TestRecoveryEndsWithTailAtEnd

  - id: recovery-scan-bounded
    name: Recovery scans stop after the bytes between head and tail
    description: With a tail no record boundary reaches and stale records around the ring, both recovery scans end and replay each pending transaction once
    priority: go_only
    environments:
      go: internal/journal/checkpoint_test.go::TestScanStopsAtUnreachableTail

  - id: stopped-replay-at-end-reads-empty
