  # ===========================================================================
  # DISTRIBUTED LOCK SAFETY (internal/lock)
  # Two or three lock managers share one device to act as separate nodes.
  # ===========================================================================

  # Docker/VM TODO: a shell test would have to freeze a node (docker pause, or
  # SIGSTOP on the QEMU process) inside a lock-held section that lasts
  # milliseconds, then resume it after StaleThreshold. Shell tests cannot target
  # that window, so the Go test simulates the pause by aging the on-disk record.
  - id: lock-stale-reclaim-paused-holder
    name: Stale lock reclaimed from paused holder
    description: A holder stalled past StaleThreshold loses its lock to another node without being told
    priority: high
    environments:
      go: ../../internal/lock/safety_test.go::TestStaleLockIsReclaimedFromPausedHolder
      docker: TODO
      vm: TODO

  - id: lock-paused-holder-release
    name: Paused holder release keeps new holder's lock
    description: A late Release from a holder whose lock was reclaimed returns ErrNotLockOwner and leaves the new holder's record intact
    priority: go_only
    environments:
      go: internal/lock/safety_test.go::TestPausedHolderReleaseKeepsReclaimedLock

  - id: lock-colliding-resources-excluded
    name: Colliding resources exclude other nodes
