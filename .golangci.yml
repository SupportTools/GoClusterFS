version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
  exclusions:
    rules:
      # gfsctl prints to the terminal and, like fmt.Printf, ignores write errors there.
      - path: ^cmd/gfsctl/
        linters: [errcheck]
        text: "`fmt\\.Fprint(f|ln)?` is not checked"

      # Known findings as of 2026-10-24; delete each rule once its code is fixed.
      - path: ^internal/goclusterfs/fs\.go$
        linters: [unused]
        text: "errRetryCreate|field sb is unused"
      - path: ^internal/extent/extent_test\.go$
        linters: [staticcheck]
        text: "SA4006: this value of found is never used"
      - path: ^internal/fsck/phase7_snapshots\.go$
        linters: [staticcheck]
        text: "SA9003"
