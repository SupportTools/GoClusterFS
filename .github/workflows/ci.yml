name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  build-and-unit-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Run go vet
        run: make vet

      - name: Check test parity manifest
        run: make test-parity

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -d .
            exit 1
          fi

      # Test images go on tmpfs: 4KB O_DIRECT writes on the runner's disk can take
      # longer than the 10ms a lock record write is allowed.
      - name: Unit Tests
        shell: bash
        env:
          TMPDIR: /dev/shm/gcfs-unit
          GOCLUSTERFS_TEST_DIR: /dev/shm/gcfs-unit
        run: |
          mkdir -p "$TMPDIR"
          dd if=/dev/zero of="$TMPDIR/odirect-check" bs=4096 count=1 oflag=direct
          make test-unit 2>&1 | tee unit-test.log

      - name: Coverage summary
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo "**Total: $(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')**"
            echo
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            awk '$1 == "ok" && $4 == "coverage:" {print "| " $2 " | " $5 " |"}' unit-test.log
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check Go version matches go.mod
        run: |
          gomod=$(go list -m -f '{{.GoVersion}}' | cut -d. -f1,2)
          if [ "$gomod" != "$GO_VERSION" ]; then
            echo "::error file=go.mod::go.mod requires Go $gomod but CI uses Go $GO_VERSION. Update GO_VERSION in .github/workflows/ci.yml."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: make vuln

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev
          sudo modprobe fuse
          which fusermount || which fusermount3

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Integration Tests
        run: |
          # Run integration tests with -short to skip stress tests that timeout in CI
          # Stress tests (TestStressRandomFailures, TestStress) require local execution
          # Lock order violation fix (Task #4798) enables concurrent file/directory creation tests
          # Extent locking fix (Task #4801) enables concurrent same-file writes test
          go test -v -timeout 5m -short ./tests/integration/...
        timeout-minutes: 10
