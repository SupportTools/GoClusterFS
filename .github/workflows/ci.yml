name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.15.0
  # Exact release, at least 48 hours old when pinned (company package-age policy).
  NODE_VERSION: "22.23.4"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Run go vet
        run: make vet

      - name: Check test parity manifest
        run: make test-parity

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -d .
            exit 1
          fi

  unit-tests:
    name: Unit Tests (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tests/scripts/unit-groups.sh splits the packages by recorded run time
        group: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check package groups
        run: tests/scripts/unit-groups.sh check ${{ strategy.job-total }}

      # Test images go on tmpfs: 4KB O_DIRECT writes on the runner's disk can take
      # longer than the 20ms a lock record write is allowed.
      - name: Unit Tests
        shell: bash
        env:
          TMPDIR: /dev/shm/gcfs-unit
          GOCLUSTERFS_TEST_DIR: /dev/shm/gcfs-unit
        run: |
          mkdir -p "$TMPDIR"
          dd if=/dev/zero of="$TMPDIR/odirect-check" bs=4096 count=1 oflag=direct
          pkgs=$(tests/scripts/unit-groups.sh packages ${{ strategy.job-total }} ${{ matrix.group }})
          make test-unit UNIT_PKGS="$pkgs" UNIT_TIMEOUT=8m COVER_PROFILE=coverage-${{ matrix.group }}.out 2>&1 | tee unit-test-${{ matrix.group }}.log
        timeout-minutes: 10

      - name: Upload coverage and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-${{ matrix.group }}
          path: |
            coverage-${{ matrix.group }}.out
            unit-test-${{ matrix.group }}.log
          retention-days: 7

  unit-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-tests-*
          merge-multiple: true

      # The groups test disjoint packages, so their profiles concatenate.
      - name: Coverage summary
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo "**Total: $(awk 'FNR > 1 { n += $2; if ($3 > 0) c += $2 } END { printf "%.1f%%", 100 * c / n }' coverage-*.out)**"
            echo
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            awk '$1 == "ok" && $4 == "coverage:" {print "| " $2 " | " $5 " |"}' unit-test-*.log | sort
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check Go version matches go.mod
        run: |
          gomod=$(go list -m -f '{{.GoVersion}}' | cut -d. -f1,2)
          if [ "$gomod" != "$GO_VERSION" ]; then
            echo "::error file=go.mod::go.mod requires Go $gomod but CI uses Go $GO_VERSION. Update GO_VERSION in .github/workflows/ci.yml."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: make vuln

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install, lint, typecheck and build
        run: make dashboard

      - name: Check the build embeds and serves
        run: go test -v -run 'TestEmbeddedBuild|TestServesBuild' ./internal/webui/

  integration-tests:
    name: Integration Tests (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        # tests/scripts/integration-groups.sh splits the tests by recorded run time
        group: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev
          sudo modprobe fuse
          which fusermount || which fusermount3

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Check test groups
        run: tests/scripts/integration-groups.sh check ${{ strategy.job-total }}

      - name: Integration Tests
        shell: bash
        run: |
          tests=$(tests/scripts/integration-groups.sh regex ${{ strategy.job-total }} ${{ matrix.group }})
          # -short skips the stress tests, which need longer than CI allows
          go test -v -timeout 8m -short -run "$tests" ./tests/integration/... 2>&1 | tee integration-${{ matrix.group }}.log
        timeout-minutes: 10

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log-${{ matrix.group }}
          path: integration-${{ matrix.group }}.log
          retention-days: 7
