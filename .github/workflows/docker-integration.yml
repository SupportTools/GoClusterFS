# GoClusterFS Docker Multi-Node Integration Tests
# Runs containerized multi-node tests for realistic cluster simulation

name: Docker Multi-Node Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger
  workflow_dispatch:
  # nightly.yml calls this with the concurrent tests in group 4. Pushes and pull
  # requests leave the inputs empty, which keeps groups 1 to 3 without them.
  workflow_call:
    inputs:
      groups:
        description: JSON list of run-tests.sh groups
        type: string
        default: "[1, 2, 3]"
      run-concurrent:
        description: Run the tests SKIP_CONCURRENT_TESTS skips
        type: boolean
        default: false
      skip-report:
        description: Do not publish the junit report as a check run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker-multinode-tests:
    name: Multi-Node Docker Tests (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # run-tests.sh in_test_group decides which tests each group runs
        group: ${{ fromJSON(inputs.groups || '[1, 2, 3]') }}
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test images
        run: |
          docker compose -f tests/docker/docker-compose.test.yml build

      - name: Create results directory
        run: |
          # Create results directory where docker-compose expects it
          # Docker Compose resolves ./results relative to the compose FILE location
          # So ./results:/results in tests/docker/docker-compose.test.yml maps to tests/docker/results/
          mkdir -p tests/docker/results

      - name: Initialize shared storage
        run: |
          # Run storage-init separately to avoid --abort-on-container-exit issue
          docker compose -f tests/docker/docker-compose.test.yml run --rm storage-init

      - name: Run multi-node tests
        run: |
          # Pull requests skip the concurrent tests, which hung on runners (Task #5176);
          # the nightly workflow runs them as group 4.
          # Export ensures docker-compose can interpolate the variable
          export SKIP_CONCURRENT_TESTS="${{ inputs.run-concurrent && 'false' || 'true' }}"
          export TEST_GROUP="${{ matrix.group }}"

          # Start the test cluster detached (no --exit-code-from as it implies --abort-on-container-exit)
          # The test intentionally kills containers to test recovery, so we can't abort on exit
          docker compose -f tests/docker/docker-compose.test.yml up -d \
            node1 node2 node3 node4 orchestrator

          # Wait for orchestrator to complete (poll every 5s, timeout 20min)
          echo "Waiting for orchestrator to complete..."
          TIMEOUT=1200
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if orchestrator is still running
            STATUS=$(docker inspect --format='{{.State.Status}}' goclusterfs-orchestrator 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "exited" ]; then
              EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' goclusterfs-orchestrator)
              echo "Orchestrator exited with code: $EXIT_CODE"

              # Show orchestrator logs
              echo "=== Orchestrator Logs ==="
              docker logs goclusterfs-orchestrator

              # Nodes log their lock statistics when they unmount, so stop them before reading their logs.
              docker compose -f tests/docker/docker-compose.test.yml stop node1 node2 node3 node4
              for n in 1 2 3 4; do
                docker logs goclusterfs-node$n 2>&1 | grep -E "lock: |\[WARN\] lock" > tests/docker/results/node$n-lock.log || true
              done
              docker compose -f tests/docker/docker-compose.test.yml down
              exit $EXIT_CODE
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "Still waiting... ($ELAPSED/$TIMEOUT seconds)"
          done

          echo "Timeout waiting for orchestrator"
          # Collect logs BEFORE removing containers
          echo "=== Timeout: Collecting logs before cleanup ===" >> tests/docker/results/container-logs.txt
          echo "=== Node 1 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node1 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 2 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node2 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 3 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node3 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 4 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node4 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Orchestrator Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-orchestrator 2>&1 >> tests/docker/results/container-logs.txt || true
          docker compose -f tests/docker/docker-compose.test.yml down
          exit 1
        timeout-minutes: 22

      - name: Collect logs on failure
        if: failure()
        run: |
          # Additional log collection in case containers still exist
          echo "=== Additional Log Collection ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node1 2>&1 >> tests/docker/results/container-logs.txt || true
          docker logs goclusterfs-node2 2>&1 >> tests/docker/results/container-logs.txt || true
          docker logs goclusterfs-node3 2>&1 >> tests/docker/results/container-logs.txt || true
          docker logs goclusterfs-node4 2>&1 >> tests/docker/results/container-logs.txt || true
          docker logs goclusterfs-orchestrator 2>&1 >> tests/docker/results/container-logs.txt || true

      - name: Cleanup containers
        if: always()
        run: |
          docker compose -f tests/docker/docker-compose.test.yml down -v --remove-orphans || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-test-results-${{ matrix.group }}
          path: tests/docker/results/
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always() && !inputs.skip-report
        with:
          report_paths: 'tests/docker/results/junit.xml'
          check_name: Docker test report (group ${{ matrix.group }})
          fail_on_failure: true
          require_tests: true
