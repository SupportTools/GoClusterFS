# GoClusterFS Docker Multi-Node Integration Tests
# Runs containerized multi-node tests for realistic cluster simulation

name: Docker Multi-Node Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  docker-multinode-tests:
    name: Multi-Node Docker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images
        run: |
          docker compose -f tests/docker/docker-compose.test.yml build

      - name: Create results directory
        run: |
          mkdir -p tests/docker/results

      - name: Initialize shared storage
        run: |
          # Run storage-init separately to avoid --abort-on-container-exit issue
          docker compose -f tests/docker/docker-compose.test.yml run --rm storage-init

      - name: Run multi-node tests
        run: |
          # Start the test cluster detached (no --exit-code-from as it implies --abort-on-container-exit)
          # The test intentionally kills containers to test recovery, so we can't abort on exit
          docker compose -f tests/docker/docker-compose.test.yml up -d \
            node1 node2 node3 node4 orchestrator

          # Wait for orchestrator to complete (poll every 5s, timeout 10min)
          echo "Waiting for orchestrator to complete..."
          TIMEOUT=600
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if orchestrator is still running
            STATUS=$(docker inspect --format='{{.State.Status}}' goclusterfs-orchestrator 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "exited" ]; then
              EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' goclusterfs-orchestrator)
              echo "Orchestrator exited with code: $EXIT_CODE"

              # Show orchestrator logs
              echo "=== Orchestrator Logs ==="
              docker logs goclusterfs-orchestrator

              # Stop remaining containers
              docker compose -f tests/docker/docker-compose.test.yml down
              exit $EXIT_CODE
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "Still waiting... ($ELAPSED/$TIMEOUT seconds)"
          done

          echo "Timeout waiting for orchestrator"
          docker compose -f tests/docker/docker-compose.test.yml down
          exit 1
        timeout-minutes: 12

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Node 1 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node1 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 2 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node2 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 3 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node3 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Node 4 Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-node4 2>&1 >> tests/docker/results/container-logs.txt || true
          echo "=== Orchestrator Logs ===" >> tests/docker/results/container-logs.txt
          docker logs goclusterfs-orchestrator 2>&1 >> tests/docker/results/container-logs.txt || true

      - name: Cleanup containers
        if: always()
        run: |
          docker compose -f tests/docker/docker-compose.test.yml down -v --remove-orphans || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: tests/docker/results/
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'tests/docker/results/junit.xml'
          fail_on_failure: true
          require_tests: true
