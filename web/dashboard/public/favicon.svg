<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#63b3ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stylized cluster/filesystem icon -->
  <rect x="10" y="25" width="80" height="55" rx="6" fill="#1a1a2e" stroke="url(#grad)" stroke-width="3"/>
  <!-- Three stacked disks representing storage -->
  <ellipse cx="50" cy="40" rx="30" ry="8" fill="url(#grad)" opacity="0.3"/>
  <ellipse cx="50" cy="52" rx="30" ry="8" fill="url(#grad)" opacity="0.5"/>
  <ellipse cx="50" cy="64" rx="30" ry="8" fill="url(#grad)" opacity="0.8"/>
  <!-- Connection nodes -->
  <circle cx="25" cy="15" r="8" fill="url(#grad)"/>
  <circle cx="50" cy="10" r="8" fill="url(#grad)"/>
  <circle cx="75" cy="15" r="8" fill="url(#grad)"/>
  <!-- Connection lines -->
  <line x1="25" y1="15" x2="50" y2="25" stroke="url(#grad)" stroke-width="2"/>
  <line x1="50" y1="10" x2="50" y2="25" stroke="url(#grad)" stroke-width="2"/>
  <line x1="75" y1="15" x2="50" y2="25" stroke="url(#grad)" stroke-width="2"/>
</svg>
